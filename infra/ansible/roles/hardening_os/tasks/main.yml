---
# OS-level hardening: filesystem mounts, auto-updates, auditd

- name: Ensure secure mount options for web root
  ansible.builtin.command: >-
    pct exec {{ template_vmid }} -- mount | grep /var/www/html
  register: www_mount
  changed_when: false
  failed_when: false

- name: Remount /var/www/html with security flags if needed
  ansible.builtin.shell: |
    pct exec {{ template_vmid }} -- bash -c '
      if ! mount | grep -q "/var/www/html.*noexec"; then
        mount -o remount,noexec,nosuid,nodev /var/www/html
        echo "mount updated"
      fi
    '
  changed_when: "'mount updated' in result.stdout"
  register: result

- name: Make mount persistent via /etc/fstab
  ansible.builtin.shell: |
    pct exec {{ template_vmid }} -- bash -c '
      if ! grep -q "^/dev/.* /var/www/html" /etc/fstab; then
        # Get current mount point and device
        MOUNT_LINE=$(mount | grep " /var/www/html " | awk "{print \$1,\$3}")
        DEVICE=$(echo $MOUNT_LINE | awk "{print \$1}")
        # Add secure mount options to fstab
        sed -i "s|^$DEVICE.*|$DEVICE /var/www/html defaults,noexec,nosuid,nodev 0 2|" /etc/fstab
        echo "fstab updated"
      fi
    '
  changed_when: "'fstab updated' in result.stdout"
  register: result

- name: Create PHP temp directories with secure permissions
  ansible.builtin.shell: |
    pct exec {{ template_vmid }} -- bash -c '
      mkdir -p /var/tmp/php-sessions /var/tmp/php-uploads
      chown www-data:www-data /var/tmp/php-sessions /var/tmp/php-uploads
      chmod 1700 /var/tmp/php-sessions /var/tmp/php-uploads
    '
  changed_when: true

- name: Set secure permissions on web root
  ansible.builtin.shell: |
    pct exec {{ template_vmid }} -- bash -c '
      find /var/www/html -type d -exec chmod 755 {} \;
      find /var/www/html -type f -exec chmod 644 {} \;
      chown -R www-data:www-data /var/www/html
    '
  changed_when: true

- name: Install unattended-upgrades for auto-security-updates
  ansible.builtin.command: >-
    pct exec {{ template_vmid }} --
    apt-get install -y -qq unattended-upgrades apt-listchanges
  changed_when: true

- name: Configure unattended-upgrades to auto-install security updates
  ansible.builtin.shell: |
    pct exec {{ template_vmid }} -- bash -c '
      cat >/etc/apt/apt.conf.d/50unattended-upgrades <<EOF
      Unattended-Upgrade::Allowed-Origins {
        "\${distro_id}:\${distro_codename}-security";
      };
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::InstallOnShutdown "true";
      Unattended-Upgrade::Mail "root";
      Unattended-Upgrade::MailReport "on-change";
      EOF
    '
  changed_when: true

- name: Enable unattended-upgrades
  ansible.builtin.shell: |
    pct exec {{ template_vmid }} -- bash -c '
      if ! grep -q "^APT::Periodic::Update-Package-Lists" /etc/apt/apt.conf.d/20auto-upgrades; then
        cat >>/etc/apt/apt.conf.d/20auto-upgrades <<EOF
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";
      EOF
      fi
    '
  changed_when: true

- name: Install auditd for security event logging
  ansible.builtin.command: >-
    pct exec {{ template_vmid }} --
    apt-get install -y -qq auditd audispd-plugins
  changed_when: true

- name: Configure audit rules for web server activity
  ansible.builtin.shell: |
    pct exec {{ template_vmid }} -- bash -c '
      cat >>/etc/audit/rules.d/web.rules <<EOF
      # Monitor web root for changes
      -w /var/www/html -p wa -k web_changes
      # Monitor nginx/PHP config
      -w /etc/nginx/ -p wa -k config_changes
      -w /etc/php/ -p wa -k config_changes
      # Monitor user/group changes
      -w /etc/passwd -p wa -k users
      -w /etc/shadow -p wa -k users
      -w /etc/group -p wa -k users
      EOF
      service auditd restart
    '
  changed_when: true

- name: Configure auditd to persist logs
  ansible.builtin.shell: |
    pct exec {{ template_vmid }} -- bash -c '
      if ! grep -q "max_log_file_action = keep_logs" /etc/audit/auditd.conf; then
        sed -i "s/^#\?max_log_file_action.*/max_log_file_action = keep_logs/" /etc/audit/auditd.conf
        service auditd restart
      fi
    '
  changed_when: true

- name: Configure logrotate for audit logs
  ansible.builtin.shell: |
    pct exec {{ template_vmid }} -- bash -c '
      cat >/etc/logrotate.d/auditlog <<EOF
      /var/log/audit/audit.log {
        rotate 10
        daily
        compress
        delaycompress
        notifempty
        create 0600 root root
        postrotate
          /sbin/service auditd restart
        endscript
      }
      EOF
    '
  changed_when: true

- name: Configure logrotate for nginx/PHP logs
  ansible.builtin.shell: |
    pct exec {{ template_vmid }} -- bash -c '
      cat >/etc/logrotate.d/nginx-php <<EOF
      /var/log/nginx/*.log /var/log/php*.log {
        rotate 14
        daily
        compress
        delaycompress
        notifempty
        create 0640 www-data adm
        sharedscripts
        postrotate
          if systemctl is-active --quiet nginx; then
            systemctl reload nginx > /dev/null 2>&1 || true
          fi
        endscript
      }
      EOF
    '
  changed_when: true

- name: Harden kernel parameters for security
  ansible.builtin.shell: |
    pct exec {{ template_vmid }} -- bash -c '
      cat >>/etc/sysctl.d/99-hardening.conf <<EOF
      # Restrict ICMP redirects
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv4.conf.all.secure_redirects = 0
      net.ipv4.conf.default.secure_redirects = 0

      # Enable SYN cookies
      net.ipv4.tcp_syncookies = 1

      # Enable reverse path filtering
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.default.rp_filter = 1

      # Restrict kernel pointer exposure
      kernel.kptr_restrict = 2
      kernel.dmesg_restrict = 1
      EOF
      sysctl -p /etc/sysctl.d/99-hardening.conf >/dev/null 2>&1
    '
  changed_when: true
