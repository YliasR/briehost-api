---
# Clone the PHP LXC template into a fresh, thin-provisioned tenant container.
# Networking: DHCP on tenant_bridge (OPNsense hands out the lease).
# Storage: tenant_disk_storage (local-lvm by default — thin provisioned).
#
# Concurrency note: with N parallel provisioning consumers (one per template
# VMID), two clones can call `pvesh get /cluster/nextid` back-to-back and get
# the same value. We MUST treat a "CT already exists" failure as "re-pick a
# new VMID and retry", not as success — otherwise the loser of the race would
# overwrite the winner's container with its own deploy. To keep pick+clone
# atomic under that constraint, the loop lives in a single shell task.

- name: Pick next free VMID and clone template (collision-retry)
  ansible.builtin.shell: |
    set -u
    for attempt in $(seq 1 10); do
      new_vmid=$(pvesh get /cluster/nextid)
      if out=$(pct clone {{ template_vmid }} ${new_vmid} \
            --full 1 \
            --storage {{ tenant_disk_storage }} \
            --pool {{ tenant_pool }} \
            --hostname {{ tenant_hostname }} 2>&1); then
        echo "BRIEHOST_NEW_VMID=${new_vmid}"
        exit 0
      fi
      echo "[attempt ${attempt}] clone failed: ${out}" >&2
      # CT-already-exists = lost the nextid race; pick again immediately.
      # lock-timeout / already-locked = another op holds the source template
      # lock (parallel clone from same VMID, or human in the Proxmox UI);
      # back off.
      if echo "${out}" | grep -qE 'already exists'; then
        continue
      fi
      if echo "${out}" | grep -qiE 'lock timeout|already locked'; then
        sleep 6
        continue
      fi
      # Unknown failure — bail immediately rather than masking it.
      exit 1
    done
    echo "exhausted clone retries" >&2
    exit 1
  register: clone_out
  changed_when: clone_out.rc == 0
  # `set -u` + the loop give us deterministic failure on exhaustion.

- name: Extract new_vmid from clone output
  ansible.builtin.set_fact:
    new_vmid: "{{ clone_out.stdout | regex_search('BRIEHOST_NEW_VMID=(\\d+)', '\\1') | first }}"

- name: Configure tenant CT resources + network (DHCP via OPNsense)
  community.proxmox.proxmox:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_token_id: "{{ proxmox_api_token_id }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    validate_certs: false
    node: "{{ target_node }}"
    vmid: "{{ new_vmid }}"
    hostname: "{{ tenant_hostname }}"
    update: true
    cores: "{{ tenant_cores }}"
    memory: "{{ tenant_memory_mb }}"
    swap: "{{ tenant_swap_mb }}"
    onboot: true
    netif:
      net0: "name=eth0,bridge={{ tenant_bridge }},ip=dhcp,firewall=0"
    # Tag for ops visibility — e.g. `pct list` filtering, Proxmox UI search.
    # IP is appended in start_container once DHCP hands one out.
    description: "briehost site={{ tenant_hostname }} site_id={{ site_id }} user_id={{ user_id }}"
  delegate_to: localhost

- name: Grow root disk to {{ tenant_disk_gb }}G (no-op if template is already that size)
  ansible.builtin.command: pct resize {{ new_vmid }} rootfs {{ tenant_disk_gb }}G
  register: resize_out
  changed_when:
    - "'already' not in resize_out.stderr | default('')"
    - "'unable to shrink' not in resize_out.stderr | default('')"
  failed_when:
    - resize_out.rc != 0
    - "'already' not in resize_out.stderr | default('')"
    - "'unable to shrink' not in resize_out.stderr | default('')"
