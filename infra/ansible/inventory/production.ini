# Production inventory for briehost provisioning.
# Replace host details with the real Proxmox node + SSH user.

[proxmox]
pve ansible_host=172.17.10.1 ansible_user=root

[proxmox:vars]
ansible_python_interpreter=/usr/bin/python3

# Gateway CT (cloudflared + Caddy). Replace ansible_host with the static IP
# you reserved on the tenant bridge.
[gateway]
brie-gw ansible_host=192.168.10.208 ansible_user=root

[gateway:vars]
ansible_python_interpreter=/usr/bin/python3
